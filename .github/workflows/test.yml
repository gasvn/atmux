name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push-only trigger leaves no way to run a commit whose workflow the
  # Actions service never created -- and it does fail to create them: on
  # 2026-08-06 four consecutive pushes got no run at all, and two more died
  # in "Set up job" with "Failed to resolve action download info", having
  # executed nothing. Re-running then meant an empty commit. This gives the
  # Actions tab a "Run workflow" button, and `gh workflow run tests` a
  # `--ref`, so any commit can be retried on its own.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test (defaults to this branch)'
        required: false
        type: string

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          # Deepen only for a hand-dispatched run, which checks out its ref in
          # the next step and needs real history to resolve it. Push and
          # pull_request runs keep their one-commit clone and skip that step
          # entirely, so they behave exactly as before.
          #
          # github.event.inputs (not the `inputs` context) is defined for every
          # event, so this is valid on push too. Quoted on purpose: `x && 0 ||
          # 1` yields 1 for every input, because 0 is falsy and the fallback
          # then always wins.
          fetch-depth: ${{ github.event.inputs.ref && '0' || '1' }}

      # actions/checkout's own `ref:` resolves branches, tags and full 40-char
      # SHAs only -- `ref: de2b2b4` fails with "could not be found", and
      # deepening the fetch does not change that. Plain git resolves an
      # abbreviation, so the ref people actually copy out of `git log
      # --oneline` works. Passed through the environment rather than
      # interpolated into the script, so the value cannot become shell syntax.
      - name: Check out the requested ref
        if: github.event.inputs.ref != ''
        env:
          REF: ${{ github.event.inputs.ref }}
        run: |
          git checkout --detach "$REF"
          git --no-pager log -1 --oneline
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run unit tests
        # Discovery is scoped to tests/ so stray scratch files at the repo
        # root can never poison the run. OS-mutating integration tests require
        # an explicit isolated-runtime opt-in and therefore skip in CI.
        run: python -m unittest discover -s tests -t . -v
