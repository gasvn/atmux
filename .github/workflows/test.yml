name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run unit tests
        # Discovery is scoped to tests/ so stray scratch files at the repo
        # root can never poison the run. OS-mutating integration tests require
        # an explicit isolated-runtime opt-in and therefore skip in CI.
        run: python -m unittest discover -s tests -t . -v
