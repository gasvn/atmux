name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A push-only trigger leaves no way to run a commit whose workflow the
  # Actions service never created -- and it does fail to create them: on
  # 2026-08-06 four consecutive pushes got no run at all, and two more died
  # in "Set up job" with "Failed to resolve action download info", having
  # executed nothing. Re-running then meant an empty commit. This gives the
  # Actions tab a "Run workflow" button, and `gh workflow run tests` a
  # `--ref`, so any commit can be retried on its own.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to test (defaults to this branch)'
        required: false
        type: string

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      # An empty `ref` keeps checkout's own default (the triggering commit),
      # so push and pull_request runs behave exactly as before.
      - uses: actions/checkout@v4
        with:
          # github.event.inputs (not the `inputs` context) is defined for
          # every event, so this expression is valid on push too.
          ref: ${{ github.event.inputs.ref || '' }}
          # Checkout's default shallow fetch asks the server for the ref by
          # name, and git cannot fetch an abbreviated SHA -- `ref: de2b2b4`
          # failed outright while the full 40 characters worked. Deepen only
          # when a ref was typed, so ordinary push runs keep their one-commit
          # clone. Quoted on purpose: `x && 0 || 1` yields 1 for every input,
          # because 0 is falsy and the fallback then wins.
          fetch-depth: ${{ github.event.inputs.ref && '0' || '1' }}
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run unit tests
        # Discovery is scoped to tests/ so stray scratch files at the repo
        # root can never poison the run. OS-mutating integration tests require
        # an explicit isolated-runtime opt-in and therefore skip in CI.
        run: python -m unittest discover -s tests -t . -v
