<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no is deliberate. Pinch zooms the *font* instead (app.js):
     zooming the viewport of a terminal leaves you panning a grid that no
     longer fits, which is worse than the small text it was meant to fix. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="atmux">
<meta name="theme-color" content="#121212">
<meta name="format-detection" content="telephone=no">
<title>atmux</title>
<link rel="stylesheet" href="xterm.css">
<link rel="manifest" href="manifest.json">
<!-- Relative, like everything else here: `tailscale serve --set-path /term`
     strips the prefix, so an absolute path would point at nothing. -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- The widths the dashboard has layouts for, filled in by the server from
     config.LAYOUT_WIDTHS. app.js sizes the font to land on one of them. -->
<!--layout-->
<!--bootstrap-->
<style>
  /* The one navigation this app has -- tap a session on the list, land in it
     -- was a hard cut between two documents. Chrome 126 and Safari 18.2 will
     cross-fade it for the cost of this rule; Firefox has not shipped it and
     simply navigates, so there is nothing to detect and nothing to fall back
     to. Both pages opt in or neither transition happens.

     Opacity only. The incoming page is a character grid, and scaling one for
     180ms is how you turn a transition into a blurry frame. */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: atmux-fade-out 110ms ease-in both; }
  ::view-transition-new(root) { animation: atmux-fade-in 170ms ease-out both; }
  @keyframes atmux-fade-out { to { opacity: 0; } }
  @keyframes atmux-fade-in { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root), ::view-transition-new(root) {
      animation: none;
    }
  }
  /* One material for the panel, named once. The drawer, the pinned headings
     and the pad itself were three different dark greys, and stacking three
     dark greys is how a single instrument reads as a pile of strips. */
  :root {
    --panel-top: #1b1b21;
    --panel-mid: #141418;
    --panel-bot: #101014;
    --label: #9a9aa6;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #121212;
    overscroll-behavior: none;          /* no rubber-banding over the terminal */
    -webkit-text-size-adjust: 100%;     /* Safari must not reflow our monospace */
  }
  #app {
    /* Fixed, so app.js can size it to visualViewport when the software
       keyboard is up -- the layout viewport does not shrink, and a page
       sized to it draws its last rows behind the keyboard. dvh is the
       starting value and the fallback where visualViewport is missing. */
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column;
    height: 100dvh;
    transform-origin: top left;
    /* viewport-fit=cover puts the page under the notch and the rounded
       corners, which is what makes the background reach every edge -- but it
       also means the insets are ours to apply. Without these the notch sits
       on top of a column of the terminal, and what you see is a black band
       down one side in landscape. */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    box-sizing: border-box;
  }
  #term {
    flex: 1 1 auto; min-height: 0;
    /* No padding at all. A terminal is a grid of whole cells, so its size is
       quantised and something is always left over; padding adds to that
       leftover without buying anything. app.js sizes the terminal to exactly
       its own grid and this box centres it, which turns the sub-character
       remainder into a hairline on each side instead of a band down one. */
    display: flex; align-items: center; justify-content: center;
    background: #121212;
    /* None, not pan-y. There is no native vertical scroll here to keep:
       xterm 6 removed the scrollable viewport, and #app is position:fixed,
       so nothing under this box ever scrolled. pan-y meanwhile declares the
       vertical drag to be the BROWSER's -- which is exactly the gesture that
       pages the scrollback, and a declared pan arrives uncancelable (and on
       iOS can end in touchcancel) no matter what the listener does. Same
       reason .key is none: on this page a drag is ours or it is nothing.
       Also drops the double-tap-to-zoom delay, which is what pan-y was for. */
    touch-action: none;
  }
  /* xterm's own stylesheet paints this element #000 and reserves a scrollbar
     on it. Both show up as a black stripe beside the dashboard, because the
     app draws its rows lighter than its background and nothing here is
     covered by the canvas. Scrolling still works -- only the chrome goes. */
  .xterm .xterm-viewport {
    background-color: transparent !important;
    scrollbar-width: none;
  }
  .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
  /* The keypad exists only where there is no real keyboard. */
  #pad { display: none; }
  body.touch #pad {
    /* Bounded as a share of #app, not in vh. #app is sized to visualViewport,
       so when the software keyboard is up the pad shrinks with it -- a
       vh-based cap would keep its full-screen height and leave the terminal
       no rows at all.
       Only a backstop now: the drawer no longer grows this box, so what is
       laid out here is four fixed rows and the cap never binds in practice. */
    flex: 0 1 auto; display: flex; flex-direction: column; max-height: 62%;
    /* The containing block for the drawer sheet, which is positioned against
       this box's top edge so that opening it never changes this box's height.
       See #sheet.open. */
    position: relative;
    /* Lit from the terminal's edge and falling off downward, with a hairline
       of light along the seam. Dark as a surface, not dark as an absence --
       which is the difference between a panel and a hole in the page. */
    background: linear-gradient(180deg, var(--panel-top) 0%,
                var(--panel-mid) 42%, var(--panel-bot) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.055);
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
    user-select: none; -webkit-user-select: none;
  }
  /* Typing mode: xterm's helper textarea is normally a one-cell element
     parked at the cursor. Stretched transparently over the terminal, a tap
     lands on a real text input and the platform raises its keyboard by
     itself -- which is the only route iOS honours. */
  .xterm-helper-textarea.atmux-typing {
    position: absolute !important;
    left: 0 !important; top: 0 !important;
    width: 100% !important; height: 100% !important;
    opacity: 0 !important; z-index: 5;
    resize: none; border: 0; padding: 0;
  }
  /* Sits between the terminal and the pad rather than floating over the
     screen: it is on while you are reading, and something that covers the
     text you are reading to tell you that you are reading is its own joke.
     Full width because it is also the target -- a thumb should not have to
     find it. */
  /* Overlaid, not laid out. As a flex child it took a row from the terminal
     the moment it appeared, and giving the terminal a different number of
     rows mid-swipe makes tmux reflow and repaint the whole screen -- a jolt
     on every gesture. #app is position:fixed, so this anchors to it. */
  #hist {
    position: absolute; top: 0; left: 0; right: 0; z-index: 15;
    text-align: center; padding: 9px 8px;
    font: 13px/1.2 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #f0d9a0; background: #3a3020;
    /* A button now, so the defaults have to be undone rather than inherited. */
    border: 0; border-bottom: 1px solid #5a4a28; width: 100%;
    -webkit-appearance: none; appearance: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #hist:active { background: #4a3d28; }
  #hist[hidden] { display: none; }
  /* Anyone who has asked the system for less motion gets the states without
     the travel. The states are the information; the movement is manners. */
  @media (prefers-reduced-motion: reduce) {
    .key, #tabs button { transition: none; }
    .key.down { transform: none; }
    .key.armed { animation: none; }
  }
  /* Created by app.js only under ?debug=1, so this styles nothing the rest
     of the time. pointer-events: none -- a readout that swallowed the very
     gesture it is reporting on would be worse than no readout. */
  #debug {
    position: fixed; left: 0; right: 0; top: 0; z-index: 20;
    font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align: center; color: #9fe8a0; background: rgba(0, 0, 0, 0.82);
    pointer-events: none;
    /* Wraps, because it must not be readable only in part. One line of
       this is ~60 characters, which is wider than a 390px phone: the first
       report back from one carried two of the five fields and the three
       that would have identified the fault were off the right edge. */
    white-space: normal; overflow-wrap: anywhere; padding: 2px 6px;
  }
  /* Movement sits closest to the thumb and stays put. Nothing below it may
     reflow it: a navigation key that moves because the app published a
     different number of actions is a key you have to look for every time. */
  #nav { flex: 0 0 auto; padding: 7px 7px 0; }
  /* Five across a 390px phone is 70px each, so `ctrl` fits on one line at the
     same size as everything else. The 11px this used to run at existed only
     to squeeze ten keys into a single row, which also left them 33px wide --
     a quarter under the 44px minimum in the direction you aim. */
  /* Equipment labelling: the modifier row is chrome, not content. Uppercase,
     tracked out, and a shade cooler than the actions below it -- the two rows
     did the same job visually before, which is why the pad read as one
     undifferentiated slab of buttons. */
  #nav .key {
    font-size: 12px; padding: 4px 5px;
    text-transform: uppercase; letter-spacing: .09em;
    color: #b9b9c6;
  }
  /* The arrows and Enter are glyphs, not words: they read at a size a word
     would not need, and they are the keys that repeat. */
  #nav .key.glyph { font-size: 18px; }
  #pins { flex: 0 0 auto; padding: 5px 7px 0; }
  /* Hidden means hidden: no smaller pad, no row of controls left behind. */
  body.touch.nopad #pad { display: none; }
  #grip { display: none; }
  body.touch.nopad #grip {
    flex: 0 0 auto; display: block; width: 100%;
    /* Short, but it sits on the bottom edge -- a thumb cannot overshoot the
       end of the screen, so the target is larger than its height. */
    height: calc(26px + env(safe-area-inset-bottom));
    padding: 0 0 env(safe-area-inset-bottom);
    background: #141418; border: 0; border-top: 1px solid #2a2a30;
    /* Raised from #6e6e78, which measured 3.64:1 here. This strip is the only
       way back to the keys once they are hidden; it cannot be the hardest
       thing on the screen to see. */
    color: #9096a0; font: 13px/1 ui-monospace, Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  body.touch.nopad #grip:active { background: #26262c; }
  /* This screen's own keys, one row, always in flow and always the same
     height. #nav and the row above it stay put for the same reason: the keys
     you reach for without looking must be in the same place every time. */
  #keys { flex: 0 0 auto; padding: 7px 7px 4px; }

  /* ── the drawer ───────────────────────────────────────────────────────
     A sheet over the terminal, not a row of the layout. As a flex child it
     took the terminal from 57 rows to 29 every time it opened, which resizes
     the pty, which makes tmux reflow and repaint the whole screen -- and then
     again on close. That is the same jolt that made swiping feel unstable,
     arriving on a tap instead of a drag. #hist solved exactly this by
     overlaying; this is that.

     Its lower edge is the top of the handle, one row above the settings row,
     and it grows upward from there -- over the keys that are already in the
     pad first, and only then over the terminal. Measured: those rows are
     255px of a 390x844 phone, and every one of their keys is also in the
     list, so while the drawer is open they are showing the reader something
     the drawer is showing them again. Opening over them costs nothing; the
     drawer used to take 252px off the terminal for the same four rows.

     #pad's own height never changes either way, so the pty is never resized.
     Both offsets are set in JS, from what the rows actually measure. */
  #sheet { display: none; }
  body.touch #sheet.open {
    display: block;
    position: absolute; left: 0; right: 0;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    /* contain, so reaching the end of the list stops there rather than
       handing the rest of the swipe to the terminal behind it. */
    overscroll-behavior-y: contain;
    padding: 8px 7px 6px; box-sizing: border-box;
    /* The panel's own colour, not a second one. It had a flat #17171d of its
       own so the pinned headings could sit on something opaque, and the
       result was a visible seam wherever it met the pad -- two materials
       stacked, which is most of why the whole thing read as strips rather
       than as one surface. This is the top stop of the pad's gradient, so the
       drawer looks like the panel continuing upward, which is what it is.
       Depth comes from the shadow it casts on the terminal instead. */
    background: var(--panel-top);
    box-shadow: 0 -14px 30px rgba(0, 0, 0, .55),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  /* Sixty-three keys do not fit, and the list used to be cut flat against the
     settings row -- which reads as damage rather than as "there is more". A
     fade says the same thing without the hard edge, and it is removed once
     there is genuinely nothing below, so it never lies. */
  body.touch #sheet.open:not(.atbottom) {
    -webkit-mask-image: linear-gradient(to bottom, #000 0,
                        #000 calc(100% - 26px), transparent 100%);
    mask-image: linear-gradient(to bottom, #000 0,
                #000 calc(100% - 26px), transparent 100%);
  }
  /* One label, used everywhere something needs naming: the drawer's sections
     and the two fixed rows alike. That is the point -- the pad had a pinned
     row and a screen row that were pixel-for-pixel identical and meant
     completely different things, and the drawer named its groups in a
     typography that appeared nowhere else. Same rule for both, so opening the
     drawer continues the page instead of starting a new one.

     The hairline carries the eye across and does the grouping that a bare
     word does not; #9a9aa6 rather than #75757f, which measured 3.96:1. */
  .ghead {
    display: flex; align-items: center; gap: 7px;
    color: var(--label); margin: 0 2px 3px;
    font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .1em; text-transform: uppercase;
  }
  /* In the drawer they separate sections and want air above them. In the pad
     each one sits directly on the row it names, and a label costs terminal:
     two of them at the drawer's spacing was five rows of a phone screen. */
  #sheet .ghead { margin-top: 6px; }
  .ghead::after {
    content: ''; flex: 1 1 auto; height: 1px;
    background: rgba(255, 255, 255, 0.055);
  }
  .ghead:first-child { margin-top: 0; }
  /* Pinned, because once you are scrolling the section you are in has already
     gone off the top -- and the section is the only thing that tells `^W` in
     ctrl from `w` in tmux. Offset by the sheet's own padding so it lands
     flush against the edge, and opaque so the keys pass behind it.

     The only sticky layer in this box, which it was not: the toolbar was
     pinned to the same edge with a higher z-index, so every heading slid
     underneath it and stayed there. Measured at four scroll positions, the
     headings buried were tmux, then tmux+ctrl, then tmux+ctrl+move -- that
     is, all of them, the whole time you were scrolling. Sticky headings you
     cannot see are worse than none: they cost the height and pay nothing. */
  #sheet .ghead {
    position: sticky; top: -8px; z-index: 2;
    background: var(--panel-top);
    margin: 0 0 4px; padding: 10px 2px 5px;
  }
  #sheet .ghead:first-child { padding-top: 2px; }
  /* ── who scrolls the drawer ───────────────────────────────────────────
     This page does, and every part of the drawer behaves the same way.

     It was briefly `pan-y` on the keys, handing the pan to the browser --
     which is correct reasoning (preventDefault stops the focus, touch-action
     alone decides the pan) and works in Chromium. It was still wrong: on a
     phone, once the browser claims the gesture it decides on its own whether
     a pointercancel follows, and a key that never hears one types whatever
     you dragged across. A control character into a live shell is not a
     defect worth a nicer scroll, and it is not checkable from here.

     `none` on the whole box, not on the keys alone. Before, a finger landing
     in a gap between two keys got the browser's scroll and a finger landing
     on a key got ours -- the same panel with two feels depending on where you
     touched it. Now the drawer is one surface with one behaviour, and app.js
     gives it weight of its own. */
  body.touch #sheet.open, #sheet .krow, #sheet .gsec, #sheet .ghead {
    touch-action: none;
  }
  /* The sheet's own toolbar, pinned above the sections. Recessed like the
     settings row for the same reason: it changes how the pad behaves rather
     than typing anything, and nothing in this sheet may be mistaken for a key
     that types. */
  /* Not pinned. It measured 57px of a 253px drawer -- 23% of the space, held
     forever, for a control used once when you set the pad up. It scrolls away
     with everything else now, and scrolling back to the top is how you reach
     it, which is the same cost as reopening the drawer. */
  #sheettop {
    padding: 0 0 6px; margin: 0;
    display: flex; gap: 6px;
  }
  #sheettop button {
    min-height: 32px; padding: 0 12px;
    color: #9096a0;
    background: linear-gradient(180deg, #131317 0%, #17171c 100%);
    border: 1px solid #000; border-radius: 8px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5),
                0 1px 0 rgba(255, 255, 255, .045);
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .04em;
    -webkit-tap-highlight-color: transparent;
    transition: color 90ms ease-out, box-shadow 90ms ease-out;
  }
  #sheettop button.on {
    color: #7ff0cb;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, .5),
                inset 0 0 0 1px rgba(70, 211, 164, .55),
                0 0 8px rgba(70, 211, 164, .12);
  }

  /* ── the handle ───────────────────────────────────────────────────────
     The seam between the drawer and the rows that never move, and the only
     control that opens it. Tap toggles; drag sets whatever height you
     actually want.

     This replaces `⌄ 38` sitting in the settings row four buttons away from
     `▾` -- two near-identical chevrons meaning "show more keys" and "hide the
     keypad", which is the kind of pair you have to learn rather than read.
     A drawer opens from its edge, so the edge is where the control goes, and
     the count can sit beside it where it obviously belongs to it. */
  #grab { display: none; }
  body.touch #grab {
    flex: 0 0 auto; display: flex;
    align-items: center; justify-content: center; gap: 9px;
    /* Short, but it spans the panel: the target is the full width of the
       screen, which is far more than the 44px a button would get. */
    /* The drawer's lower edge, one row above the settings row -- which is
       both where the drawer opens from and the part of the pad a thumb
       reaches without the hand moving. It sits above the sheet in paint
       order, so opening the drawer never covers the way to close it. */
    width: 100%; height: 26px; padding: 0;
    background: none; border: 0;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    position: relative; z-index: 2;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    /* The gesture is a resize; the browser must not read it as a scroll or a
       text selection partway through. */
    user-select: none; -webkit-user-select: none;
  }
  /* The grip itself. Wider and lit when the drawer is open, so the handle
     says which state it is in without a second glyph to learn. */
  #grab span {
    display: block; width: 34px; height: 4px; border-radius: 2px;
    background: #4a4a56;
    transition: background 120ms ease-out, width 120ms ease-out;
  }
  #grab b {
    font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .1em; text-transform: uppercase;
    font-weight: 400; color: var(--label);
  }
  body.touch #grab.open span { width: 46px; background: #6f6f7e; }
  body.touch #grab:active span { background: #8a8a99; }
  body.touch #grab.dragging span { background: #46d3a4; }
  /* Fixed columns, never wrapping the row: flex-wrap stretched whichever key
     landed alone on the last line into a full-width button, which read as
     something important rather than as the leftover it was. A short last row
     is padded with invisible keys instead. */
  .krow { display: flex; gap: 5px; margin-bottom: 5px; }
  .krow .key { flex: 1 1 0; min-width: 0; }
  .key.gap { background: none; border-color: transparent; }
  /* ── the panel ────────────────────────────────────────────────────────
     A terminal is an instrument, not an app, so the pad is built as one: a
     key is a machined cap sitting proud of the surface, lit from above, with
     a dark edge under it and its own shadow. That is also where interface
     design went for 2026 -- depth and texture back after a decade of flat,
     "pressable rather than symbolic" -- and it costs three gradients.

     One accent, and it means one thing: mint says the next keystroke will
     come out changed. Amber, on the history bar, says you are not live.
     Nothing else is coloured, so both read at a glance in a dark room. */
  .key {
    min-height: 44px;                   /* Apple's minimum touch target */
    padding: 4px 5px;
    color: #e4e4ea;
    background:
      linear-gradient(180deg, #33333c 0%, #2a2a32 55%, #24242b 100%);
    border: 1px solid #1a1a20;
    border-radius: 10px;
    /* Top highlight, bottom edge, cast shadow: the three lines that turn a
       rectangle into something with a thickness. */
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      inset 0 -1px 0 rgba(0, 0, 0, 0.45),
      0 1px 2px rgba(0, 0, 0, 0.55);
    /* The labels are the app's own descriptions -- "Auto-renew job", not a
       bare `k` -- so they wrap rather than clip. A truncated label is a
       button whose meaning you have to already know, which is the problem
       these replaced. */
    font: 11px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .01em;
    white-space: normal; overflow-wrap: anywhere; hyphens: auto;
    -webkit-tap-highlight-color: transparent;
    /* None on the fixed rows: there is nothing under them to scroll, and a
       drag through them must not move something else. The drawer overrides
       this -- see #sheetkeys .key. */
    touch-action: none;
    /* Transform and shadow only: both composite, so a key can depress while
       the terminal is repainting without costing a layout. */
    transition: transform 70ms ease-out, box-shadow 70ms ease-out,
                background-color 70ms ease-out;
  }
  .key.gap {
    background: none; border-color: transparent; box-shadow: none;
  }
  /* Pressed: the cap goes down into the panel. The cast shadow collapses and
     the inner shadow inverts, which is what makes it read as travel rather
     than as a colour change. */
  .key.down {
    transform: translateY(1px);
    background: linear-gradient(180deg, #3d3d48 0%, #35353f 100%);
    box-shadow:
      inset 0 2px 4px rgba(0, 0, 0, 0.55),
      inset 0 -1px 0 rgba(255, 255, 255, 0.05),
      0 0 0 rgba(0, 0, 0, 0);
  }
  /* Locked until you clear it: filled, and lit, because it stays that way. */
  .key.on {
    color: #04140f;
    background: linear-gradient(180deg, #6ef0c4 0%, #46d3a4 100%);
    border-color: #2fae86;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.45),
      0 0 12px rgba(70, 211, 164, 0.28),
      0 1px 2px rgba(0, 0, 0, 0.5);
  }
  /* Armed for one keystroke vs locked until you clear it. Two states that
     behave differently have to look different, or the row goes on typing
     control characters after you thought it had stopped: outlined for the
     one-shot, filled for the lock. */
  .key.armed {
    color: #7ff0cb;
    border-color: #46d3a4;
    box-shadow:
      inset 0 0 0 1px #46d3a4,
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 0 10px rgba(70, 211, 164, 0.18);
  }
  /* One pulse when it arms, not a loop: it marks the moment the state
     changed and then gets out of the way. A modifier that throbbed forever
     would be an alarm. */
  @keyframes armpulse {
    from { box-shadow: inset 0 0 0 1px #46d3a4, 0 0 0 0 rgba(70,211,164,.55); }
    to   { box-shadow: inset 0 0 0 1px #46d3a4, 0 0 0 9px rgba(70,211,164,0); }
  }
  .key.armed { animation: armpulse 340ms ease-out; }
  /* Choosing, not pressing. A key that looks the same in both modes is a key
     that types when you meant to keep it. */
  .key.choose { border-style: dashed; color: #a8a8b4; }
  .key.choose::after {
    content: '+'; position: absolute; top: 2px; right: 5px;
    font-size: 11px; line-height: 1; color: #6e6e78;
  }
  .key.choose.kept {
    border-style: solid; border-color: #b98900; color: #f0d08a;
  }
  .key.choose.kept::after { content: '★'; color: #b98900; }
  /* The app's own keys share this drawer and cannot be kept. Shown as
     unavailable rather than left looking ordinary: an ordinary-looking key
     that does nothing is indistinguishable from a broken one. */
  .key.locked { opacity: .35; }
  .key { position: relative; }
  #tabs {
    flex: 0 0 auto;
    display: flex; gap: 6px; padding: 0 7px 7px; align-items: center;
  }
  /* Settings, not keys: these change how the pad behaves rather than typing
     anything, so they are cut INTO the panel where the caps sit ON it. Same
     material, opposite relief -- which is the whole difference in one line of
     shadow, and means nothing here can be mistaken for something that types.
     */
  #tabs button {
    /* 44px both ways, same as the caps. This row was left at 40x34 when the
       keys were fixed -- under the minimum in BOTH directions, which is why
       it was the one row you had to aim at. Seven of them at 44 plus gaps and
       padding is 358px, so a 390px phone has room and the spacer absorbs the
       rest. */
    min-height: 44px; min-width: 44px; padding: 0 8px;
    color: #8b8b95;
    background: linear-gradient(180deg, #131317 0%, #17171c 100%);
    border: 1px solid #000; border-radius: 8px;
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, 0.5),
      0 1px 0 rgba(255, 255, 255, 0.045);
    font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
    transition: color 90ms ease-out, box-shadow 90ms ease-out;
  }
  /* Engaged: lit from within rather than filled, so the row still reads as
     recessed. */
  #tabs button.on {
    color: #7ff0cb;
    box-shadow:
      inset 0 1px 2px rgba(0, 0, 0, 0.5),
      inset 0 0 0 1px rgba(70, 211, 164, 0.55),
      0 0 8px rgba(70, 211, 164, 0.12);
  }
  #tabs .spacer { flex: 1 1 auto; }
  #status {
    position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 6px; background: #2a2a30; color: #ddd;
    font: 13px ui-monospace, Menlo, monospace; display: none; z-index: 10;
    pointer-events: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #121212; color: #9a9aa2; z-index: 20; padding: 24px;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  }
  #boot b { color: #d8d8dc; }
  #booterr { color: #e07a7a; max-width: 40em; white-space: pre-wrap;
             word-break: break-word; }

  /* ── landscape ────────────────────────────────────────────────────────
     Last in the file on purpose: every rule here overrides one above it at
     the same specificity, so it only wins by coming after. Written earlier in
     the stylesheet, `.key { min-height: 40px }` lost to the 44px rule further
     down and the whole block silently did half its job.

     Measured at 844x390 before any of this: the pad was 217px and the
     terminal 173px -- twelve rows, less room than the keys attached to it --
     because nothing in this file had ever asked what orientation it was in.
     The navigation row was the visible half: ten keys in two rows of five,
     each 162px wide, four times the width one needs, to save nothing.
     app.js puts all ten on one row when they fit (see perRow); this is the
     rest.

     Bounded by height as well as orientation: a tablet in landscape has the
     room and should keep the taller keys and the roomier rows. */
  @media (orientation: landscape) and (max-height: 560px) {
    /* No cap. It existed to stop the drawer eating the screen, and the drawer
       is a sheet now -- what is left is four rows of fixed height. A cap that
       still binds does not shrink them, because none of them may shrink; it
       pushes the settings row off the bottom of the screen, which is exactly
       what 46% did. Better to be honest about the height than to hide the row
       you most need to reach. */
    body.touch #pad { max-height: none; }
    #nav { padding-top: 5px; }
    /* The kept keys stand down here, and only here. They exist to save you
       from opening the drawer -- and in landscape the row below already shows
       ten of this screen's keys instead of five, and the sheet shows all sixty
       at once. So they buy least exactly where a row costs most: this one is
       58px of a 390px screen, about four rows of terminal. They are back the
       moment the phone turns. */
    #pins { display: none; }
    #keys { padding: 5px 7px 3px; }
    #tabs { padding-bottom: 5px; }
    .krow { gap: 4px; margin-bottom: 4px; }
    /* Still well over 44 in the direction a thumb aims -- ten across 844px is
       79px wide -- so the target is larger than the 162x44 it replaces even
       at 40 tall. Height is the one dimension a short screen cannot spend,
       and 40px is Android's minimum where 44 is Apple's. */
    .key { min-height: 40px; }
    #nav .key.glyph { font-size: 16px; }
    #tabs button { min-height: 40px; }
    #grip { height: calc(22px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="term"></div>
  <!-- Two sources, and the split is the design. What the *app* can do is
       published by the app (keypad.py, OSC 7710) and never written here,
       because a copy is only correct on the day it is written. What a
       *terminal* can do is written here and never published, because it is
       true of every program and has to work when nothing is publishing at
       all -- in a bare shell, during a reconnect, after the handover to
       tmux. -->
  <!-- Where you are, when that is not "live". A swipe puts tmux into
       copy-mode and nothing in tmux takes it back out: measured, after
       scrolling up and back down the pane still reported pane_in_mode=1 and
       a typed `echoXYZ` reached nothing at all. The screen looks live and
       is not, which is a state you have to be told you are in. Chat clients
       solved the same problem years ago -- lock the position, show a way
       back to the latest -- and this is that button.

       Static, never created at runtime: it also carries the page count
       during a drag, when a structural DOM change would end the gesture.

       A button, and announced. It was a <div> with a click handler, which
       made the app's only you-are-not-live indicator the one thing a screen
       reader never mentioned -- while every key around it carried an
       aria-label. aria-live is polite rather than assertive because it also
       updates on every frame of a drag. -->
  <button id="hist" type="button" hidden
          aria-live="polite" aria-label="stop reading history"></button>
  <div id="pad">
    <!-- esc, the two modifiers, tab and the arrows. Fixed, in this order, and
         nothing below may reflow it: a key that moves because the far end
         published a different number of actions is a key you have to look for
         every time. -->
    <div id="nav"></div>
    <!-- The keys this person kept, if any. Fixed like the row above it: the
         point of keeping a key is that it stops moving. -->
    <div id="pins"></div>
    <!-- This screen's own keys, one row. Never changes height, because the
         terminal above it is sized to what is left over. -->
    <div id="keys"></div>
    <!-- Everything, in labelled sections down one column. A sheet over the
         terminal rather than a row of the layout: see #sheet.open. -->
    <div id="sheet">
      <!-- Pinned to the top of the sheet, because keeping a key is something
           you do to the keys in front of you. The whole feature used to be an
           unlabelled ☆ in the settings row acting on the four keys the closed
           drawer happened to show. -->
      <div id="sheettop">
        <button id="edit" aria-label="choose which keys to keep">
          ☆ keep keys</button>
      </div>
      <div id="sheetkeys"></div>
    </div>
    <!-- The seam of the drawer, and the one control that opens it.
         It used to be a `⌄ 38` button in the settings row, four buttons away
         from `▾`, which is a near-identical chevron meaning something else
         entirely -- and the number beside it explained nothing. A drawer
         opens from its edge; that is what an edge looks like, and the same
         handle drags to whatever height you actually want. -->
    <button id="grab" aria-expanded="false"
            aria-label="more keys"><span></span><b id="grabcount"></b></button>
    <div id="tabs">
      <!-- The way out. From inside a session the only route back to the list
           was `detach`, seventh key into the drawer under `tmux` -- and this
           page is built to be installed to the home screen, where there is no
           browser chrome to fall back on. It sends the same thing that key
           does; the socket closing is what returns you. -->
      <button id="back" aria-label="back to the session list">‹ list</button>
      <!-- Two controls used to live here that do not belong in a settings
           row. `⌄ 38` opened the drawer -- a drawer opens from its edge, so
           it is the handle above now. `☆` chose which keys to keep, which is
           only meaningful while you can see the keys, so it is at the top of
           the sheet. What is left is only things that change how the pad
           behaves, which is what this row is for.
           Six buttons, so each gets a word where a word is clearer than a
           glyph -- there was never room for that at eight. -->
      <span class="spacer"></span>
      <button id="fontminus" aria-label="smaller">A−</button>
      <!-- Lit while the layout is choosing the size, which is the normal
           state. Tapping it hands the decision back after a pinch. -->
      <button id="fontauto" aria-label="automatic size">A</button>
      <button id="fontplus" aria-label="larger">A+</button>
      <button id="kbd" aria-label="keyboard">⌨</button>
      <button id="hide" aria-label="hide the keys">hide</button>
    </div>
  </div>
  <!-- The way back, and the only thing left when the pad is hidden. At the
       very bottom edge, where a thumb cannot overshoot it. -->
  <button id="grip" aria-label="show the keys">⌃</button>
</div>
<div id="status"></div>
<!-- Shown until the terminal actually starts. A Content-Security-Policy that
     blocked the script produced a page that was simply blank, with nothing on
     screen and nothing in the server log to say why. Whatever fails next
     should at least say so here. -->
<div id="boot">
  <b>atmux</b> — starting…
  <div id="booterr"></div>
</div>

<script src="xterm.js"></script>
<script src="app.js"></script>
</body>
</html>
