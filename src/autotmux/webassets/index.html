<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- user-scalable=no is deliberate. Pinch zooms the *font* instead (app.js):
     zooming the viewport of a terminal leaves you panning a grid that no
     longer fits, which is worse than the small text it was meant to fix. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="atmux">
<meta name="theme-color" content="#121212">
<meta name="format-detection" content="telephone=no">
<title>atmux</title>
<link rel="stylesheet" href="xterm.css">
<link rel="manifest" href="manifest.json">
<!-- The widths the dashboard has layouts for, filled in by the server from
     config.LAYOUT_WIDTHS. app.js sizes the font to land on one of them. -->
<!--layout-->
<!--bootstrap-->
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #121212;
    overscroll-behavior: none;          /* no rubber-banding over the terminal */
    -webkit-text-size-adjust: 100%;     /* Safari must not reflow our monospace */
  }
  #app {
    /* Fixed, so app.js can size it to visualViewport when the software
       keyboard is up -- the layout viewport does not shrink, and a page
       sized to it draws its last rows behind the keyboard. dvh is the
       starting value and the fallback where visualViewport is missing. */
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column;
    height: 100dvh;
    transform-origin: top left;
    /* viewport-fit=cover puts the page under the notch and the rounded
       corners, which is what makes the background reach every edge -- but it
       also means the insets are ours to apply. Without these the notch sits
       on top of a column of the terminal, and what you see is a black band
       down one side in landscape. */
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    box-sizing: border-box;
  }
  #term {
    flex: 1 1 auto; min-height: 0;
    /* No padding at all. A terminal is a grid of whole cells, so its size is
       quantised and something is always left over; padding adds to that
       leftover without buying anything. app.js sizes the terminal to exactly
       its own grid and this box centres it, which turns the sub-character
       remainder into a hairline on each side instead of a band down one. */
    display: flex; align-items: center; justify-content: center;
    background: #121212;
    touch-action: pan-y;                /* keep vertical scroll, drop the
                                           double-tap-to-zoom delay */
  }
  /* xterm's own stylesheet paints this element #000 and reserves a scrollbar
     on it. Both show up as a black stripe beside the dashboard, because the
     app draws its rows lighter than its background and nothing here is
     covered by the canvas. Scrolling still works -- only the chrome goes. */
  .xterm .xterm-viewport {
    background-color: transparent !important;
    scrollbar-width: none;
  }
  .xterm .xterm-viewport::-webkit-scrollbar { display: none; }
  /* The keypad exists only where there is no real keyboard. */
  #pad { display: none; }
  body.touch #pad {
    flex: 0 0 auto; display: block;
    background: #141418; border-top: 1px solid #2a2a30;
    padding-bottom: env(safe-area-inset-bottom);
    box-sizing: border-box;
    user-select: none; -webkit-user-select: none;
  }
  /* Typing mode: xterm's helper textarea is normally a one-cell element
     parked at the cursor. Stretched transparently over the terminal, a tap
     lands on a real text input and the platform raises its keyboard by
     itself -- which is the only route iOS honours. */
  .xterm-helper-textarea.atmux-typing {
    position: absolute !important;
    left: 0 !important; top: 0 !important;
    width: 100% !important; height: 100% !important;
    opacity: 0 !important; z-index: 5;
    resize: none; border: 0; padding: 0;
  }
  /* Movement sits closest to the thumb and stays put. Nothing below it may
     reflow it: a navigation key that moves because the app published a
     different number of actions is a key you have to look for every time. */
  #nav { padding: 7px 7px 0; }
  #nav .key { font-size: 15px; }
  #keys { padding: 7px 7px 4px; }
  /* Fixed columns, never wrapping the row: flex-wrap stretched whichever key
     landed alone on the last line into a full-width button, which read as
     something important rather than as the leftover it was. A short last row
     is padded with invisible keys instead. */
  .krow { display: flex; gap: 5px; margin-bottom: 5px; }
  .krow .key { flex: 1 1 0; min-width: 0; }
  .key.gap { background: none; border-color: transparent; }
  .key {
    min-height: 44px;                   /* Apple's minimum touch target */
    padding: 4px 5px;
    background: #26262c; color: #e2e2e6; border: 1px solid #383840;
    border-radius: 9px;
    /* The labels are the app's own descriptions -- "Auto-renew job", not a
       bare `k` -- so they wrap rather than clip. A truncated label is a
       button whose meaning you have to already know, which is the problem
       these replaced. */
    font: 11px/1.15 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: normal; overflow-wrap: anywhere; hyphens: auto;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;                 /* a held key repeats; it never scrolls */
  }
  .key.down { background: #4a4a58; border-color: #6f6f80; }
  .key.on { background: #3c5a8a; border-color: #5b82bd; color: #fff; }
  #tabs {
    display: flex; gap: 6px; padding: 0 7px 7px; align-items: center;
  }
  #tabs button {
    min-height: 34px; min-width: 40px; padding: 0 10px;
    background: transparent; color: #8b8b95;
    border: 1px solid #2e2e36; border-radius: 8px;
    font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  #tabs button.on { background: #2f2f3a; color: #e2e2e6; border-color: #4d4d5c; }
  #tabs .spacer { flex: 1 1 auto; }
  #status {
    position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 6px; background: #2a2a30; color: #ddd;
    font: 13px ui-monospace, Menlo, monospace; display: none; z-index: 10;
    pointer-events: none;
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #121212; color: #9a9aa2; z-index: 20; padding: 24px;
    font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center;
  }
  #boot b { color: #d8d8dc; }
  #booterr { color: #e07a7a; max-width: 40em; white-space: pre-wrap;
             word-break: break-word; }
</style>
</head>
<body>
<div id="app">
  <div id="term"></div>
  <!-- Filled in from what the dashboard publishes, not from a list kept
       here. Empty until it says something, because a keypad invented for a
       program we cannot ask is a row of buttons that lie. -->
  <div id="pad">
    <!-- Movement and escape. Not published by the app and not optional: they
         are terminal primitives, they are the only way to move a cursor on a
         screen with no keyboard, and they must survive anything the far end
         does or stops doing. -->
    <div id="nav"></div>
    <div id="keys"></div>
    <div id="tabs">
      <!-- No pages. The keys come from the dashboard and change with its
           screen; the only thing left to choose is how many rows to show. -->
      <button id="more" aria-label="more keys">⌄</button>
      <span class="spacer"></span>
      <button id="fontminus" aria-label="smaller">A−</button>
      <!-- Lit while the layout is choosing the size, which is the normal
           state. Tapping it hands the decision back after a pinch. -->
      <button id="fontauto" aria-label="automatic size">A</button>
      <button id="fontplus" aria-label="larger">A+</button>
      <button id="kbd" aria-label="keyboard">⌨</button>
    </div>
  </div>
</div>
<div id="status"></div>
<!-- Shown until the terminal actually starts. A Content-Security-Policy that
     blocked the script produced a page that was simply blank, with nothing on
     screen and nothing in the server log to say why. Whatever fails next
     should at least say so here. -->
<div id="boot">
  <b>atmux</b> — starting…
  <div id="booterr"></div>
</div>

<script src="xterm.js"></script>
<script src="app.js"></script>
</body>
</html>
