<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scalable, unlike the console. There is no character grid here to be
     thrown out of alignment, so pinching does the ordinary useful thing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="atmux">
<meta name="theme-color" content="#121212">
<meta name="format-detection" content="telephone=no">
<title>atmux</title>
<link rel="manifest" href="manifest.json">
<!-- Filled in by the server. Must come before anything relative -- it is what
     puts the trailing slash back, and every href below is resolved against
     the address the browser actually asked for. -->
<!--bootstrap-->
<style>
  /* A list, not a terminal. Everything the console had to fight for -- a
     layout that fits, text that wraps, rows you can touch, a keyboard that
     does not steal half the screen -- is what a page does by default. */
  :root {
    --bg: #121212; --panel: #1a1a1e; --line: #2a2a30;
    --ink: #e2e2e6; --dim: #8b8b95;
    --live: #3fb950; --hint: #d29922; --stale: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
    overscroll-behavior-y: contain;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 10px;
    padding: 12px 14px 10px; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .age { color: var(--dim); font-size: 13px; margin-left: auto; }
  header .age.stale { color: var(--stale); }

  ul { list-style: none; margin: 0; padding: 0; }
  /* Two targets on one row, both full height: tapping the row attaches,
     tapping ⋯ opens the dashboard standing on it, where every other action
     lives. Side by side rather than stacked so neither is a near-miss for
     the other. */
  li { display: flex; align-items: stretch;
       border-bottom: 1px solid var(--line); }
  li .row { flex: 1 1 auto; border-bottom: 0; }
  .more {
    flex: 0 0 56px; background: none; border: 0; border-left: 1px solid
    var(--line); color: var(--dim); font-size: 20px; line-height: 1;
  }
  .more:active { background: var(--panel); }
  .row {
    display: grid; gap: 2px 10px; align-items: center;
    grid-template-columns: 14px 1fr auto;
    /* 44px is Apple's minimum and the reason the console needed a keypad at
       all. Here a row is the target, so it simply is one. */
    min-height: 60px; padding: 10px 14px;
    background: none; border-left: 0; border-right: 0; border-top: 0;
    width: 100%; text-align: left; color: inherit; font: inherit;
  }
  .row:active { background: var(--panel); }
  /* Every cell placed explicitly. Left to auto-placement the two row-
     spanning children compete for the same track and the session name --
     the thing you are looking for -- ends up on the far right. */
  .dot {
    grid-column: 1; grid-row: 1 / span 2;
    width: 9px; height: 9px; border-radius: 50%; background: var(--live);
  }
  .dot.hint { background: var(--hint); }
  .dot.stale { background: var(--stale); }
  .dot.none { background: #3a3a42; }
  .name { grid-column: 2; grid-row: 1; font-weight: 600;
          overflow-wrap: anywhere; }
  .name .placeholder { color: var(--dim); font-weight: 400; }
  .meta { grid-column: 2; grid-row: 2; color: var(--dim); font-size: 13px;
          overflow-wrap: anywhere; }
  .right { grid-column: 3; grid-row: 1 / span 2;
           text-align: right; color: var(--dim);
           font-size: 13px; white-space: nowrap; }
  .right b { display: block; color: var(--ink); font-weight: 600; }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    border-radius: 999px; font-size: 11px; vertical-align: 1px;
    background: #1f3a2a; color: var(--live);
  }
  .tag.paused { background: #3a1f1f; color: var(--stale); }
  .tag.renewing { background: #3a331f; color: var(--hint); }

  section { padding: 16px 14px 28px; }
  section h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 0 0 8px;
  }
  /* Raw `squeue -l`, so it keeps its own alignment and scrolls on its own
     rather than making the page scroll sideways. */
  pre {
    margin: 0; padding: 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo,
                            monospace; color: var(--ink);
  }
  .empty { color: var(--dim); padding: 28px 14px; text-align: center; }
  .bar {
    position: sticky; bottom: 0; display: flex; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line);
  }
  .bar a, .bar button {
    flex: 1 1 0; min-height: 44px; display: flex; align-items: center;
    justify-content: center; gap: 6px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font: 15px/1 inherit; text-decoration: none;
  }
  .bar a:active, .bar button:active { background: #26262c; }
  .err {
    margin: 10px 14px; padding: 10px 12px; border-radius: 8px;
    background: #2a1a1a; color: #f0a0a0; font-size: 13px;
  }
  @media (prefers-color-scheme: light) {
    /* Deliberately none: this is a dashboard for a dark terminal workflow
       and it sits beside a terminal. One look, chosen. */
  }
</style>
</head>
<body>
<header>
  <h1>atmux</h1>
  <span class="age" id="age">…</span>
</header>
<div id="err" class="err" hidden></div>
<ul id="list"></ul>
<section id="queue" hidden>
  <h2 id="queue-title">queue</h2>
  <pre id="queue-body"></pre>
</section>
<div class="bar">
  <a id="console" href="console/">▤ terminal</a>
  <button id="refresh" type="button">⟳ refresh</button>
</div>
<script src="dash.js"></script>
</body>
</html>
