<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Scalable, unlike the console. There is no character grid here to be
     thrown out of alignment, so pinching does the ordinary useful thing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="atmux">
<meta name="theme-color" content="#121212">
<meta name="format-detection" content="telephone=no">
<title>atmux</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!-- Filled in by the server. Must come before anything relative -- it is what
     puts the trailing slash back, and every href below is resolved against
     the address the browser actually asked for. -->
<!--bootstrap-->
<!-- Which build this page is. The five-second poll already carries the
     server's, so this page can notice a deploy without asking anything
     extra -- see dash.js. -->
<!--build-->
<style>
  /* A list, not a terminal. Everything the console had to fight for -- a
     layout that fits, text that wraps, rows you can touch, a keyboard that
     does not steal half the screen -- is what a page does by default. */
  /* The other half of the transition. Must match the console's opt-in or the
     navigation stays a hard cut -- both documents have to agree. */
  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: atmux-fade-out 110ms ease-in both; }
  ::view-transition-new(root) { animation: atmux-fade-in 170ms ease-out both; }
  @keyframes atmux-fade-out { to { opacity: 0; } }
  @keyframes atmux-fade-in { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root), ::view-transition-new(root) {
      animation: none;
    }
  }
  :root {
    --bg: #121212; --panel: #1a1a1e; --line: #2a2a30;
    --ink: #e2e2e6; --dim: #8b8b95;
    --live: #3fb950; --hint: #d29922; --stale: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
    overscroll-behavior-y: contain;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 8px 10px 14px; background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .age { color: var(--dim); font-size: 13px; margin-left: auto; }
  header .age.stale { color: var(--stale); }
  /* The one control that earned its place. It used to sit in a sticky bar at
     the foot of the page next to a refresh button -- about 70px of a phone
     screen, permanently, for one link and one button answering a question the
     five-second poll had already answered. */
  header .go {
    display: flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; border-radius: 10px;
    color: var(--ink); text-decoration: none; font-size: 19px;
    border: 1px solid var(--line); background: var(--panel);
  }
  header .go:active { background: #26262c; }

  /* ── pull to refresh ──────────────────────────────────────────────────
     The gesture a phone reaches for first, and the page used to refuse it:
     overscroll-behavior-y: contain turns off the browser's own, and the
     button that replaced it sat in a bar costing a permanent 70px.
     A strip that opens under the header and pushes the list down with the
     finger, which is what both platforms do and therefore what the gesture
     already means. In flow rather than sticky: a sticky strip would open
     *behind* the sticky header and show about a third of itself. */
  #pull {
    height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); background: var(--bg);
    font-size: 12px; letter-spacing: .04em;
    transition: height 160ms ease-out;
  }
  #pull.dragging { transition: none; }
  #pull.armed { color: var(--accent); }
  #pull.busy { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) {
    #pull { transition: none; }
  }

  ul { list-style: none; margin: 0; padding: 0; }
  /* Two targets on one row, both full height: tapping the row attaches,
     tapping ⋯ opens the dashboard standing on it, where every other action
     lives. Side by side rather than stacked so neither is a near-miss for
     the other. */
  li { display: flex; align-items: stretch;
       border-bottom: 1px solid var(--line); }
  li .row { flex: 1 1 auto; border-bottom: 0; }
  .more {
    flex: 0 0 56px; background: none; border: 0; border-left: 1px solid
    var(--line); color: var(--dim); font-size: 20px; line-height: 1;
  }
  .more:active { background: var(--panel); }
  .row {
    display: grid; gap: 2px 10px; align-items: center;
    /* A row is something you hold, so it is not something you select. The
       long press was landing on ordinary text inside a button: iOS selected
       it, painted the whole row blue and offered its own callout on top of
       the sheet we were opening. The console learnt this; the dashboard had
       never needed it until now. */
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    /* The hold has to look like it is happening. Half a second with no
       feedback reads as a tap that missed, which is why people press
       harder rather than longer. */
    transition: transform 160ms cubic-bezier(.32, .72, 0, 1),
                background-color 160ms ease-out;
    transform-origin: center;
    grid-template-columns: 14px 1fr auto;
    /* 44px is Apple's minimum and the reason the console needed a keypad at
       all. Here a row is the target, so it simply is one. */
    min-height: 60px; padding: 10px 14px;
    background: none; border-left: 0; border-right: 0; border-top: 0;
    width: 100%; text-align: left; color: inherit; font: inherit;
  }
  .row:active { background: var(--panel); }
  /* Held, and about to open: the row settles back and lights up. Small on
     purpose -- this is a list of rows, and one that jumps is one that looks
     like it moved to somewhere else. */
  .row.holding { transform: scale(.97); background: var(--panel); }
  .row.lifted {
    transform: scale(1); background: #23232b;
    box-shadow: 0 0 0 1px var(--accent) inset;
  }
  /* Every cell placed explicitly. Left to auto-placement the two row-
     spanning children compete for the same track and the session name --
     the thing you are looking for -- ends up on the far right. */
  .dot {
    grid-column: 1; grid-row: 1 / span 2;
    width: 9px; height: 9px; border-radius: 50%; background: var(--live);
  }
  .dot.hint { background: var(--hint); }
  .dot.stale { background: var(--stale); }
  .dot.none { background: #3a3a42; }
  /* Two lines, then an ellipsis. A run named
     `diffusion-pretrain-stage2-resume-from-ckpt-40k` wrapped to five lines
     on a 320px phone and made one row 184px tall -- the same complaint the
     table answered with a clip and a marquee. Two lines is ~40 characters,
     which is enough to tell two similar runs apart; one line is not. */
  .name { grid-column: 2; grid-row: 1; font-weight: 600;
          overflow-wrap: anywhere;
          display: -webkit-box; -webkit-box-orient: vertical;
          -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
  .meta { grid-column: 2; grid-row: 2; color: var(--dim); font-size: 13px;
          overflow-wrap: anywhere; }
  .right { grid-column: 3; grid-row: 1 / span 2;
           text-align: right; color: var(--dim);
           font-size: 13px; white-space: nowrap; }
  .right b { display: block; color: var(--ink); font-weight: 600;
             font-variant-numeric: tabular-nums; }
  /* Two numbers with their names on them. They used to read `38.42/64` --
     a load average over a core count, which is true and unreadable while
     walking. The table beside this page says `cpu 60%`; so does this, and
     the GPU it has been sending all along is finally on the screen. */
  .rail { display: flex; gap: 7px; justify-content: flex-end;
          font-variant-numeric: tabular-nums; font-size: 12px; }
  .rail:empty { display: none; }
  /* One colour, for the one state that costs the reader something: load
     past the core count. See level() -- a GPU at 87% is a job running well,
     and the first draft painted it the colour of a warning. */
  .chip.hot { color: var(--stale); }
  /* What a group of rows is. The table has headed its bands since the day
     the list stopped sorting by hostname; this page had the same order and
     none of the words for it, so four rows you cannot attach to sat under
     four you can with nothing in between saying so. */
  li.band {
    display: block; padding: 16px 14px 6px;
    color: var(--dim); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em;
    border-bottom: 1px solid var(--line); background: var(--bg);
  }
  li.band:first-child { padding-top: 10px; }
  .tag {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    border-radius: 999px; font-size: 11px; vertical-align: 1px;
    background: #1f3a2a; color: var(--live);
  }
  .tag.paused { background: #3a1f1f; color: var(--stale); }
  .tag.renewing { background: #3a331f; color: var(--hint); }

  /* The bottom bar is gone, so the last thing on the page needs the room the
     bar used to occupy -- otherwise the queue ends flush against the home
     indicator. */
  section { padding: 16px 14px calc(28px + env(safe-area-inset-bottom)); }
  section h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); margin: 0 0 8px;
  }
  /* Raw `squeue -l`, so it keeps its own alignment and scrolls on its own
     rather than making the page scroll sideways. */
  pre {
    margin: 0; padding: 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
    overflow-x: auto; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo,
                            monospace; color: var(--ink);
  }
  /* display:block, because `li` above is a flex container and a bare text
     node in one becomes a flex item sized to its own content -- which is
     why "no sessions" was centred in the stylesheet and left-aligned on
     the screen. */
  li.empty { display: block; color: var(--dim); padding: 28px 14px;
             text-align: center; border-bottom: 0; }
  .err {
    margin: 10px 14px; padding: 10px 12px; border-radius: 8px;
    background: #2a1a1a; color: #f0a0a0; font-size: 13px;
  }
  /* A deploy landed while this page was open, or while it was a home-screen
     app iOS had put to sleep. Under the header rather than in the footer: at
     the bottom of a long list it would be a notice nobody is looking at. */
  #update {
    display: block; width: calc(100% - 28px); margin: 10px 14px;
    padding: 11px 12px; border: 1px solid #1f4a6d; border-radius: 8px;
    background: #16283a; color: var(--accent); font: inherit;
    font-size: 14px; text-align: left; -webkit-appearance: none;
  }
  #update:active { background: #1c3348; }
  #update[hidden] { display: none; }
  /* The quiet half: what this page is, when it is already current. Small,
     last, and never in the way -- but there, so "did it update?" has an
     answer you can read instead of a deploy you have to take on faith. */
  /* The action sheet. Bottom-anchored, because that is where a thumb is
     and because it is the shape every phone already uses for this. */
  #sheet {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0, 0, 0, .5);
    display: flex; align-items: flex-end; justify-content: center;
    /* The backdrop fades and the card slides, separately: a single fade of
       the whole thing reads as a screenshot appearing rather than as
       something arriving from the bottom edge. */
    opacity: 0;
    -webkit-backdrop-filter: blur(0px); backdrop-filter: blur(0px);
    transition: opacity 200ms ease-out,
                backdrop-filter 260ms ease-out,
                -webkit-backdrop-filter 260ms ease-out;
  }
  #sheet[hidden] { display: none; }
  #sheet.in {
    opacity: 1;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #sheetcard {
    width: 100%; max-width: 34rem;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 14px 14px 0 0;
    padding: .6rem .6rem calc(.6rem + env(safe-area-inset-bottom));
    /* Overshoots very slightly and settles, which is what a spring does and
       what every sheet on this platform does. The curve is mine rather than
       a published constant -- Apple documents the behaviour, not the
       numbers -- and it is tuned to arrive quickly and stop dead. */
    transform: translateY(100%);
    transition: transform 320ms cubic-bezier(.32, .72, 0, 1);
  }
  #sheet.in #sheetcard { transform: translateY(0); }
  /* Anyone who asked the system for less motion gets the states without the
     travel. The sheet still arrives; it simply does not slide. */
  @media (prefers-reduced-motion: reduce) {
    #sheet, #sheetcard, .row { transition: none; }
    .row.holding { transform: none; }
  }
  #sheettitle {
    padding: .5rem .8rem .6rem; color: var(--dim); font-size: 13px;
    overflow-wrap: anywhere;
  }
  .act {
    display: block; width: 100%; margin: 0 0 .4rem;
    /* 44 is the floor a thumb needs, and this is a list of verbs read in a
       hurry -- several of which change something. */
    min-height: 46px; padding: 0 1rem;
    border: 1px solid var(--line); border-radius: 10px;
    background: #1f1f25; color: var(--ink);
    font: inherit; font-size: 15px; text-align: left;
    -webkit-appearance: none; -webkit-tap-highlight-color: transparent;
  }
  .act:active { background: #26262e; }
  .act.danger { color: var(--stale); border-color: #4a2b2b; }
  .act.cancel { text-align: center; color: var(--dim); margin-bottom: 0; }
  .act[disabled] { opacity: .5; }
  #build {
    margin: 22px 14px calc(18px + env(safe-area-inset-bottom));
    color: var(--dim); font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    /* Deliberately none: this is a dashboard for a dark terminal workflow
       and it sits beside a terminal. One look, chosen. */
  }
</style>
</head>
<body>
<header>
  <h1>atmux</h1>
  <span class="age" id="age">…</span>
  <a class="go" id="console" href="console/" aria-label="terminal">▤</a>
</header>
<!-- Opens under the header while you drag the list down, and says what letting
     go will do. Empty and zero-height until then. role=status so the outcome
     is announced rather than only drawn. -->
<div id="pull" role="status"></div>
<div id="err" class="err" hidden></div>
<!-- Shown only when the server is serving a build this page is not. A button
     because the fix is one tap, and a tap is the whole point: the reason this
     exists is that reloading a home-screen app is otherwise a gesture most
     people do not know they need. -->
<button id="update" type="button" hidden></button>
<ul id="list"></ul>
<section id="queue" hidden>
  <h2 id="queue-title">queue</h2>
  <pre id="queue-body"></pre>
</section>
<footer id="build"></footer>
<!-- What a long press opens. Empty and hidden until then; the row it acts
     on is written in the heading, because a sheet that does not say what it
     is about is a sheet you dismiss to go and check. -->
<div id="sheet" hidden>
  <div id="sheetcard" role="dialog" aria-modal="true"
       aria-labelledby="sheettitle">
    <div id="sheettitle"></div>
    <div id="sheetacts"></div>
    <button class="act cancel" type="button" data-act="cancel">Cancel</button>
  </div>
</div>
<script src="dash.js"></script>
</body>
</html>
