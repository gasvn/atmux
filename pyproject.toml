[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autotmux"
dynamic = ["version"]
description = "Terminal dashboard for managing tmux sessions across slurm compute nodes."
readme = "README.md"
# The daemon uses PEP 604 (`int | None`) annotations evaluated at import
# time, so 3.10 is the real floor.
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shanghua Gao" }]
keywords = ["tmux", "slurm", "ssh", "hpc", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Clustering",
    "Topic :: Terminals",
]
dependencies = [
    "textual>=0.40",
    "rich>=13.0",
]

[project.scripts]
atmux = "autotmux.cli:main"
atd = "autotmux.daemon:main_entry"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["autotmux"]

[tool.setuptools.dynamic]
version = { attr = "autotmux.__version__" }
